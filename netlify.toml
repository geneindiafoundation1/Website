# Netlify build settings. The official Next.js runtime is detected automatically
# and handles the publish directory, SSR and image optimisation.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# The database keep-alive runs on GitHub Actions (.github/workflows/keep-alive.yml),
# not as a Netlify scheduled function - that would cost compute credits.
